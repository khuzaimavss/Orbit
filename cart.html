<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — ORBIT</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="ring"></span>ORBIT</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="reviews.html">Reviews</a>
      <a href="game.html">Game</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div style="display:flex; align-items:center; gap:14px;">
      <a href="cart.html" class="cart-link active">Cart (<span data-cart-count>0</span>)</a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<section id="cartSection" style="padding-bottom:0;">
  <div class="wrap">
    <div class="eyebrow-num">Your Selection</div>
    <h2 style="margin-bottom:30px;">Cart &amp; checkout</h2>
    <div id="cartContent"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>© 2026 ORBIT. In constant motion.</span>
    <a href="admin/login.html">Admin</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/store.js"></script>
<script src="js/motion.js"></script>
<script>
  const content = document.getElementById('cartContent');

  function money(n){ return '$' + n.toFixed(2); }

  function renderEmpty(){
    content.innerHTML = `
      <p class="empty-note">Your cart is empty. <a href="shop.html" style="text-decoration:underline;">Browse the shop →</a></p>
    `;
  }

  async function renderCart(){
    content.innerHTML = '<p class="empty-note">Loading…</p>';
    const lines = await STORE.cartLines();
    if(!lines.length){ renderEmpty(); return; }

    const linesHtml = lines.map(l => `
      <div class="cart-line" data-id="${l.productId}">
        <div class="cart-thumb"><img src="${l.product.image}" alt="${l.product.name}"></div>
        <div>
          <div class="product-name">${l.product.name}</div>
          <div class="product-meta" style="margin-bottom:8px;"><span>${l.product.category}</span></div>
          <button class="remove-x" data-remove="${l.productId}">Remove</button>
        </div>
        <div class="qty-box">
          <button data-minus="${l.productId}">−</button>
          <input type="number" min="1" value="${l.qty}" data-qty="${l.productId}">
          <button data-plus="${l.productId}">+</button>
        </div>
        <div style="font-weight:500;">${money(l.product.price * l.qty)}</div>
      </div>
    `).join('');

    const subtotal = await STORE.cartSubtotal();

    content.innerHTML = `
      <div style="display:grid; grid-template-columns:1fr 340px; gap:50px; align-items:start;">
        <div>${linesHtml}</div>
        <div class="cart-summary">
          <div class="row"><span>Items</span><span>${STORE.cartCount()}</span></div>
          <div class="row total"><span>Subtotal</span><span>${money(subtotal)}</span></div>
          <p style="font-size:0.82rem; color:var(--paper-dim); margin:14px 0 20px;">Shipping and any discount are confirmed with you directly after checkout.</p>
          <button class="btn btn-block" id="checkoutBtn">Checkout</button>
        </div>
      </div>

      <div id="checkoutForm" style="display:none; max-width:560px; margin-top:60px; border-top:1px solid var(--line); padding-top:50px;">
        <h2 style="margin-bottom:8px;">Delivery details</h2>
        <p style="color:var(--paper-dim); margin-bottom:26px; font-size:0.92rem;">We'll send your order summary to our team over WhatsApp to confirm payment and delivery.</p>
        <form id="orderForm">
          <div class="field"><label for="custName">Full name</label><input id="custName" required></div>
          <div class="field"><label for="custPhone">Phone number</label><input id="custPhone" type="tel" required placeholder="+92 3xx xxxxxxx"></div>
          <div class="field"><label for="custAddress">Delivery address</label><textarea id="custAddress" rows="3" required></textarea></div>
          <div class="field"><label for="custCode">Discount code (optional)</label><input id="custCode" placeholder="From the mini-game"></div>
          <button class="btn btn-forest btn-block" type="submit">Submit order via WhatsApp</button>
        </form>
      </div>
    `;

    window.ORBIT.applyReveal();

    document.getElementById('checkoutBtn').addEventListener('click', () => {
      document.getElementById('checkoutForm').style.display = 'block';
      document.getElementById('checkoutForm').scrollIntoView({ behavior:'smooth' });
    });

    content.querySelectorAll('[data-minus]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.minus;
      const line = (await STORE.cartLines()).find(l => l.productId === id);
      STORE.updateCartQty(id, Math.max(1, line.qty - 1));
      renderCart();
    }));
    content.querySelectorAll('[data-plus]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.plus;
      const line = (await STORE.cartLines()).find(l => l.productId === id);
      STORE.updateCartQty(id, line.qty + 1);
      renderCart();
    }));
    content.querySelectorAll('[data-qty]').forEach(inp => inp.addEventListener('change', () => {
      STORE.updateCartQty(inp.dataset.qty, Math.max(1, parseInt(inp.value || 1)));
      renderCart();
    }));
    content.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
      STORE.removeFromCart(b.dataset.remove);
      renderCart();
    }));

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Submitting…';

      const lines = await STORE.cartLines();
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const code = document.getElementById('custCode').value.trim();
      const subtotal = await STORE.cartSubtotal();

      const order = await STORE.createOrder({
        name, phone, address, code,
        items: lines.map(l => ({ productId: l.productId, name: l.product.name, qty: l.qty, price: l.product.price })),
        total: subtotal
      });

      const cfg = await STORE.getConfig();
      const itemsText = lines.map(l => `• ${l.product.name} x${l.qty} — ${money(l.product.price * l.qty)}`).join('%0A');
      const waText = `Order ${order.id}%0A${itemsText}%0ASubtotal: ${money(subtotal)}${code ? '%0ACode: ' + encodeURIComponent(code) : ''}%0A%0AName: ${encodeURIComponent(name)}%0APhone: ${encodeURIComponent(phone)}%0AAddress: ${encodeURIComponent(address)}`;
      const waLink = `https://wa.me/${cfg.whatsapp}?text=${waText}`;

      STORE.clearCart();

      content.innerHTML = `
        <div class="confirm-box">
          <div class="eyebrow-num" style="border:none;">Order received</div>
          <div class="order-id">${order.id}</div>
          <p style="color:var(--paper-dim);">Thanks, ${name.split(' ')[0] || 'there'} — we've logged your order. Send it to us on WhatsApp to confirm payment and delivery timing.</p>
          <a href="${waLink}" target="_blank" class="btn btn-forest" style="margin-top:24px;">Send order on WhatsApp</a>
          <div style="margin-top:18px;"><a href="shop.html" style="text-decoration:underline; font-size:0.88rem;">Continue shopping</a></div>
        </div>
      `;
    });
  }

  renderCart();
</script>
</body>
</html>
